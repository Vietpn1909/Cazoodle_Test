[project]
name = "uiuc-research"
version = "0.1.0"
description = "UIUC Research Portal + domain LLM assistant (workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = ["uiuc-backend", "uiuc-pipeline"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "pipeline"]

[tool.uv.sources]
uiuc-backend = { workspace = true }
uiuc-pipeline = { workspace = true }

# ---------------------------------------------------------------- tooling
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["app", "pipeline"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "N802", "RUF001", "RUF002", "RUF003"]
# Name/keyword normalization deliberately handles look-alike unicode characters.
"pipeline/src/pipeline/faculty/*" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests", "pipeline/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: requires a running Postgres (docker compose up db)",
    "slow: loads the real embedding model; only runs with --run-slow",
]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
